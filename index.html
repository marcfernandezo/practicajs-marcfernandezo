<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/style.css" />
    <title>LS PokeMemory</title>
  </head>
  <body>
    <main id="app">
      <form id="user-form" class="card" hidden>
        <h1>LS PokeMemory</h1>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />

        <p id="user-error" class="error" role="alert"></p>
        <button type="submit">Entrar</button>
      </form>

      <section id="game" hidden>
        <div class="game-left">
          <form id="game-form" class="card" novalidate>
            <label for="cards-number">Número de cartas</label>
            <input type="text" id="cards-number" name="cards-number" inputmode="numeric" placeholder="Ej: 12" />
            <button type="submit" id="play-btn">Jugar</button>
          </form>

          <p id="timer">0m 0s</p>
          <p id="game-message" role="status"></p>
          <div id="game-board" hidden></div>
        </div>

        <aside id="ranking" class="card">
          <h2>Ranking</h2>
          <table>
            <thead>
              <tr>
                <th scope="col">Posición</th>
                <th scope="col">Username</th>
                <th scope="col">Mail</th>
                <th scope="col">Tiempo</th>
                <th scope="col">Cartas</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <p id="ranking-message"></p>
        </aside>
      </section>
    </main>

    <dialog id="modal">
      <p id="modal-message"></p>
      <form method="dialog">
        <button type="submit" id="modal-close">Cerrar</button>
      </form>
    </dialog>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
